# Journey Book CI
#
# The repo had no pipeline at all, so its green suites were enforced by nobody:
# every check below was already runnable locally and nothing required anyone to
# run it. The commands are the ones `forge-project.json` declares as the real
# build and test commands, split into jobs rather than run as one script.
#
# Why split, given `pnpm -r build && dotnet build` is a single line there:
#
#  - The backend integration tests need a live Docker daemon (Testcontainers +
#    postgis/postgis:16-3.4, via PostgisApiFactory). GitHub-hosted ubuntu runners
#    ship one, so they DO run here — but as their own job, so "PostGIS container
#    would not start" is never mistaken for "the code is broken", which is
#    exactly the confusion a single combined job produces. Contributors without
#    Docker locally run `dotnet test --filter
#    "FullyQualifiedName!~JourneyBook.Tests.Api."`, and the `dotnet-unit` job is
#    that same filter, so what they run locally is a real gate rather than a
#    weaker private variant. The filter names the NAMESPACE because `~` is a
#    case-insensitive substring match — see the note on the job itself.
#  - TS and .NET failures arrive independently instead of one masking the other.
#  - `repo-hygiene` needs no toolchain at all and answers in seconds.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the older run pointless; don't burn runners on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Repo hygiene: no toolchain, so it reports before the builds have installed.
  # These are the audit checks that catch things no unit test can see — secrets
  # reachable from a Docker build context, and a compose file that ships a
  # credential or a debug environment.
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Secrets cannot reach a Docker build context
        run: bash harness/checks/secrets.sh
      - name: Compose ships no credential and no Development default
        run: bash harness/checks/compose-hardening.sh
      - name: Every workspace import has a TypeScript project reference
        run: bash harness/checks/project-references.sh

  ts:
    name: TypeScript (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # Version comes from the root package.json `packageManager` field, so it
        # cannot drift from what developers use.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc -b` across the project references; must precede the tests, which
      # resolve cross-package imports through each package's dist.
      - run: pnpm -r build
      # The golden fixture, regenerated from the engine and diffed. This runs the
      # real `buildPageGrid` against `data/fixtures/sample-atlas.json`'s recorded
      # parameters, which is the byte-for-byte half of the claim
      # `packages/atlas-core/src/fixture.test.ts` makes about itself. It had been
      # referenced by no package script, no CI step and no harness check — it ran
      # when a human remembered — while being the only thing in the repo that
      # binds the fixture to the engine at all. Needs the build above.
      - name: The golden fixture still matches what the engine produces
        run: pnpm check:fixture
      # The print-resolution table, regenerated from the engine and diffed — the
      # same shape as the fixture check above, for the same reason. The scale
      # picker shows users this table before they print, and
      # `docs/print-resolution.md` (which the picker links to) is written from it.
      # Before it existed the figure was hand-typed prose in three places over two
      # latitude ranges, checked by nothing. A change to a preset's width, the
      # basemap's zoom ceiling or the page geometry now fails here until the table
      # users read is regenerated with it. Needs the build above (map-sources dist).
      - name: The print-resolution table users see still matches the engine
        run: pnpm check:print-resolution
      # The page-count lever table. Same shape again: the answer to "how do I get
      # fewer pages?" is measured from `pageGridSize` -- the counting a real
      # render does -- rather than typed into prose. It had been measured once by
      # hand and copied into a roadmap, where it drifted from the engine and
      # overstated two levers. Needs the build above (atlas-core dist).
      - name: The page-count lever table still matches the engine
        run: pnpm check:page-count
      # Covers test files as well as src — see typecheck-covers-tests.sh.
      - run: pnpm -r typecheck
      - name: Test files are inside the typecheck program
        run: bash harness/checks/typecheck-covers-tests.sh
      - run: pnpm -r test

  dotnet-unit:
    name: .NET (build + unit tests, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore JourneyBook.slnx
      - run: dotnet build JourneyBook.slnx --no-restore

      # EF Core ships one command that answers "does the model still match the
      # migrations", and it ran nowhere — not here, not in the harness, not in a
      # test. Nothing in this repository could tell you that an entity, a HasData
      # seed or an IEntityTypeConfiguration had changed with no migration behind
      # it. That does not fail a build; it fails a DEPLOY, where MigrateOnStartup
      # applies every migration, reports success, and leaves the database a
      # column or a seed row short of the code. This repo has already found one
      # orphaned migration by hand.
      #
      # In dotnet-unit rather than dotnet-integration because it needs no
      # database and no Docker — it reads the compiled model, not a server.
      - name: The EF model has a migration behind it
        run: bash harness/checks/migrations-current.sh

      # The same filter contributors use when they have no Docker daemon, so the
      # locally-runnable suite is itself gated.
      #
      # Filter on the NAMESPACE, not the bare word "Api". `~` in VSTest matches a
      # substring and ignores case, and `api` is a substring of ordinary English —
      # rapid, capital, therapies — and of ordinary type names. `!~Api` was silently
      # dropping the four `AdminApiKeyGateTests` cases, which are in
      # `JourneyBook.Tests`, need no Docker, and gate the admin API key: they ran
      # only in `dotnet-integration`, and never in the command CLAUDE.md tells a
      # contributor without Docker to run. `JourneyBook.Tests.Api.` cannot collide
      # with a word.
      - name: Unit tests
        run: dotnet test JourneyBook.slnx --no-build --filter "FullyQualifiedName!~JourneyBook.Tests.Api."

      # Belt to the braces above: whatever the filter is, the two jobs must between
      # them run every test. If a rename ever puts a case in neither set — the exact
      # failure that hid the AdminApiKeyGateTests cases — this fails the build
      # instead of losing it.
      #
      # It READS the filter out of the step above rather than keeping a copy, so
      # editing that line is the drift it catches rather than the drift it misses.
      # It also asserts CLAUDE.md quotes the same filter, because that line is the
      # command a contributor without Docker is told to run.
      - name: Every test is in exactly one of the two jobs
        run: bash harness/checks/test-filter-partitions.sh

  dotnet-integration:
    name: .NET integration (Testcontainers PostGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # Fail here, legibly, rather than inside a hundred DockerUnavailableException
      # stack traces if a runner image ever drops the daemon.
      - name: Docker daemon is available
        run: docker info
      - run: dotnet restore JourneyBook.slnx
      - run: dotnet build JourneyBook.slnx --no-restore
      - name: Full test suite (pulls postgis/postgis:16-3.4)
        run: dotnet test JourneyBook.slnx --no-build
