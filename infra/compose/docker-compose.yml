# Journey Book — local stack. Run from the repository root:
#   docker compose -f infra/compose/docker-compose.yml up --build
#
# Services:
#   db   Postgres + PostGIS (project metadata, atlas geometry)
#   api  ASP.NET Core API (http://localhost:5180)
#   web  React/Vite app behind nginx (http://localhost:8080), proxies /api + /health to api

name: journeybook

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journeybook}
      # No default, deliberately. A shipped fallback password is not a default,
      # it is a published credential: every checkout of this repo knew the
      # superuser password of every stack ever started from it. `:?` makes
      # compose refuse to start until the operator sets one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-journeybook}
    ports:
      # Bound to loopback: the api reaches db:5432 inside the compose network, so
      # the published port exists only for local psql/inspection and has no reason
      # to be reachable from the LAN. 5433 so a locally installed Postgres on 5432
      # does not conflict.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journeybook} -d ${POSTGRES_DB:-journeybook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      # Production by default. This file IS the documented run path ("docker
      # compose up --build" in the README), so defaulting to Development meant
      # the normal way to run Journey Book served developer exception pages —
      # stack traces, file paths and framework versions — to anything that could
      # reach the port. Override explicitly when you want them.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-journeybook};Username=${POSTGRES_USER:-journeybook};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env (see .env.example)}"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      # The api waits for a healthy db, so apply migrations on boot here.
      Database__MigrateOnStartup: "true"
      # The api proxies render requests to the internal render-worker service.
      RenderWorker__BaseUrl: "http://render-worker:8090"
      # Route the worker's basemap tile fetches back through THIS api's Stage 3 tile
      # proxy (shared disk cache + attribution + PMTiles), not direct to USGS.
      Tiles__ProxyBaseUrl: "http://api:8080/api/tiles"
    ports:
      - "${API_PORT:-5180}:8080"
    depends_on:
      db:
        condition: service_healthy
      render-worker:
        condition: service_healthy
    volumes:
      # Short-lived render artifacts / generated PDFs (kept out of the image).
      - ../../data/generated:/app/data/generated
      - ../../data/cache:/app/data/cache

  render-worker:
    build:
      context: ../..
      dockerfile: infra/docker/render-worker.Dockerfile
    environment:
      GENERATED_DIR: /app/data/generated
    # Port 8090 stays internal to the compose network; the unauthenticated
    # worker is not reachable from the host (expose, not host-published ports).
    expose:
      - "8090"
    volumes:
      # Same shared volume as api so worker-written PDFs are visible to the api.
      - ../../data/generated:/app/data/generated
    healthcheck:
      # 127.0.0.1 (not localhost): the worker binds IPv4 0.0.0.0, but localhost
      # resolves to IPv6 ::1 first in the container → connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Give the Node service time to boot before failures count against the
      # api's `depends_on: service_healthy` gate.
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db-data:
